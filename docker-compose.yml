version: "3.9"

services:
  # ----------------------------------------------------------
  # Backend — FastAPI + APScheduler
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: haqi_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Dashboard — Streamlit
  # ----------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: haqi_dashboard
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ----------------------------------------------------------
  # Database — PostgreSQL 15 + TimescaleDB
  # ----------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: haqi_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haqi}
      POSTGRES_USER: ${POSTGRES_USER:-haqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haqi_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haqi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------
  # Prometheus — metrics scraping
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: haqi_prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  # ----------------------------------------------------------
  # Grafana — dashboards
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: haqi_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # NOTE: ML server is NOT included here.
  # It is an external service. Set ML_SERVER_URL in .env.

volumes:
  pgdata:
  grafana_data:
